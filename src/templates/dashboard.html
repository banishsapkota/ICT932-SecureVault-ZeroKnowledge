{% extends "base.html" %}

{% block content %}

<p id="status" role="status"></p>
<meta name="csrf-token" content="{{ csrf_token() }}">
<section class="card">
    <h2>Encrypted Vault</h2>

    <p>
        Use a separate master passphrase (at least 12 characters). There is no recovery if you forget it. Vault encryption and decryption occur
        in your browser.
    </p>

    <label>
        Vault master password
        <input
            type="password"
            id="masterPassword"
            autocomplete="off"
        >
    </label>

    <button id="unlockButton">
        Unlock Vault
    </button>

    <button id="lockButton">
        Lock
    </button>
</section>

<section
    id="vaultArea"
    class="card hidden"
>
    <h3>Add credential</h3>

    <label>
        Label
        <input id="entryLabel">
    </label>

    <label>
        Username / Email
        <input id="entryUsername">
    </label>

    <label>
        Password
        <input
            type="password"
            id="entryPassword"
        >
    </label>

    <button id="generateButton">
        Generate Strong Password
    </button>

    <button id="saveButton">
        Encrypt & Save
    </button>

    <h3>Vault Entries</h3>

    <div id="entryList"></div>
</section>



<script
    src="{{ url_for('static', filename='js/vault.js') }}"
></script>

{% endblock %}
