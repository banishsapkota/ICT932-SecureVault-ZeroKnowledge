<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>SecureVault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <header>
        <h1>SecureVault</h1>

        {% if current_user.is_authenticated %}
        <nav>
            <a href="{{ url_for('dashboard') }}">
                Vault
            </a>

            {% if current_user.role == 'admin' %}
            <a href="{{ url_for('admin.dashboard') }}">
                Admin
            </a>
            {% endif %}

            <form
                method="post"
                action="{{ url_for('auth.logout') }}"
                class="inline"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <button type="submit">
                    Logout
                </button>
            </form>
        </nav>
        {% endif %}
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
            <div class="flash">
                {{ message }}
            </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
