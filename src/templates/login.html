{% extends "base.html" %}

{% block content %}

<section class="card">
    <h2>Secure login</h2>

    <form
        method="post"
        action="{{ url_for('auth.login') }}"
    >
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Username
            <input
                name="username"
                required
            >
        </label>

        <label>
            Password
            <input
                type="password"
                name="password"
                required
            >
        </label>

        <button type="submit">
            Continue
        </button>
    </form>

    <p>
        <a href="{{ url_for('auth.register') }}">
            Create an account
        </a>
    </p>
</section>

{% endblock %}
